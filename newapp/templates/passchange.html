<form method="post">
    {% csrf_token %}

    <div class="mb-3">
        {{ form.old_password.label_tag }}
        {{ form.old_password }}
    </div>

    <div class="mb-3">
        {{ form.new_password1.label_tag }}
        {{ form.new_password1 }}
    </div>

    <div class="mb-3">
        {{ form.new_password2.label_tag }}
        {{ form.new_password2 }}
    </div>

    <button type="submit" class="btn btn-primary">
        Change Password
    </button>
</form>
